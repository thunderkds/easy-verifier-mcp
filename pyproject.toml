[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-verifier-mcp"
version = "0.1.0"
description = "Context packer that gathers citable evidence from a repository. Performs no inference."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# No runtime dependencies yet. The `mcp` SDK (NFR-008) is required by the MCP
# adapter (T009) and is added by that task; declaring it here now would make
# `pip install -e .` fail for a package that does not import it.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
