# --- log statements in source code -------------------------------------------

[[log_calls]]
value = [
    '(?<![\w.])(?:self\.)?(?:logging|logger|log|_log|_logger|LOGGER|LOG)\.(?:debug|info|warning|warn|error|exception|critical|fatal|log)\s*\(',
    '(?<![\w.])print\s*\(',
]
citation_url = "https://docs.python.org/3/library/logging.html"
source_tag = "curated"

[[log_calls]]
value = ['(?<![\w.])console\.(?:log|info|warn|error|debug|trace)\s*\(']
citation_url = "https://developer.mozilla.org/en-US/docs/Web/API/console"
source_tag = "curated"

# NestJS and other class-held loggers: this.logger.log(...), this.logger.error(...)
[[log_calls]]
value = ['(?<![\w.])this\.(?:_?logger|_?log)\.(?:log|error|warn|debug|verbose|fatal|info|trace)\s*\(']
citation_url = "https://docs.nestjs.com/techniques/logger"
source_tag = "curated"

[[log_calls]]
value = [
    '(?<![\w.])(?:System\.(?:out|err)\.print(?:ln|f)?|(?:log|logger|LOG|LOGGER)\.(?:trace|debug|info|warn|error))\s*\(',
]
citation_url = "https://www.slf4j.org/manual.html"
source_tag = "curated"

[[log_calls]]
value = ['(?<![\w.])(?:log|fmt|slog)\.(?:Print|Fatal|Panic|Info|Warn|Error|Debug)\w*\s*\(']
citation_url = "https://pkg.go.dev/log"
source_tag = "curated"

[[log_calls]]
value = ['(?<![\w.])(?:puts|Rails\.logger\.\w+|logger\.(?:debug|info|warn|error|fatal))[\s(]']
citation_url = "https://guides.rubyonrails.org/debugging_rails_applications.html#the-logger"
source_tag = "curated"

[[log_calls]]
value = ['(?<![\w.>$])(?:error_log|syslog)\s*\(|\$(?:this->)?logger->(?:debug|info|notice|warning|error|critical)\s*\(']
citation_url = "https://www.php-fig.org/psr/psr-3/"
source_tag = "curated"

[[log_calls]]
value = ['(?<![\w.])(?:_?logger|_log)\.Log(?:Trace|Debug|Information|Warning|Error|Critical)\s*\(|Console\.Write(?:Line)?\s*\(']
citation_url = "https://learn.microsoft.com/en-us/dotnet/core/extensions/logging"
source_tag = "curated"

[[log_calls]]
value = ['(?<![\w.])(?:log::)?(?:trace|debug|info|warn|error|println|eprintln)!\s*\(']
citation_url = "https://docs.rs/log/latest/log/"
source_tag = "curated"
